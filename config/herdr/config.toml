# herdr — the terminal multiplexer. niritasks opens one session per project
# workspace (`herdr --session <workspace>`), so this is what a project's
# terminal is.
onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

# Keep a mouse selection highlighted until Ctrl+C copies and clears it, so a
# drag in copy mode (prefix+[) survives for speak.selection (prefix+shift+a).
# Outside copy mode herdr drops a selection on any key press, prefix included.
[ui]
copy_on_select = false

# ─── worktrees ────────────────────────────────────────────────────────────────
# Worktrees go through worktrunk, by way of the herdr-worktrunk plugin, never
# herdr's own worktree commands. worktrunk runs the repo's .config/wt.toml hooks
# — the .env copy, a port and a cloned database per worktree, and dropping that
# database on the way out — and herdr's native worktrees run none of it. So the
# plugin takes the keys, prefix+shift+g included (herdr's own "new worktree";
# a user binding silently replaces a default one). herdr's sidebar menu still
# lists its native worktree items, and nothing here can remove them: don't use
# them. See docs/worktree-setup.md.
#
# prefix+shift+d and +r, which the plugin's README suggests, are herdr's close
# workspace and reload config, so remove and remotes sit on free letters.
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "worktree: switch to or create (from the default branch)"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "worktree: create from the current branch"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "worktrunk.open-with-remotes"
description = "worktree: pick from local and remote branches"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "worktree: merge into the default branch and remove"

[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "worktrunk.remove"
description = "worktree: remove (drops its database; keeps an unmerged branch)"

# Speak through local Kokoro, via the speak plugin in ~/Projects/herdr-speak.
# Pick Files for a markdown plan, or Last answer to tick the paragraphs of the
# focused agent's last answer to hear. Press again while it prepares to cancel.
# Not +p, which is herdr's rename pane.
[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "speak.plan"
description = "speak: pick a plan file or last-answer paragraphs and read them aloud (again to cancel)"

# Select text in a pane, then hear it rewritten, shown beside the pane with live
# captions and a player. Press again while it prepares to cancel. Not +r, which
# is herdr's reload config.
[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "speak.selection"
description = "speak: read the selected text aloud (again to cancel)"

# When done, stop any speech and close the spinner, text, captions and player
# panes the plugin opened. Next to +v; not +x, which is herdr's close tab.
[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "speak.close"
description = "speak: stop and close the text, captions and player panes"
