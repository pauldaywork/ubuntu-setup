# Minimal fuzzel theme for open_project_workspace.sh — just the list of
# ~/Projects folders, nothing else. Kept separate from fuzzel.ini (passed with
# --config=) so it can be this stripped-down without affecting other fuzzel use.
#
# lines and width are set on the command line, sized to the actual folder list.

[main]
font=Ubuntu:size=16
line-height=38
# Empty prompt: no label, no header. The input row still renders (fuzzel always
# shows one) but it's blank until you type, and typing filters the list.
prompt=""
icons-enabled=no
# overlay so it sits above fullscreen windows, like the DMS spotlight.
layer=overlay
horizontal-pad=28
vertical-pad=18
inner-pad=12
match-counter=no
# The script feeds the folders in alphabetical order — keep it.
sort-result=no

# Colours track the DMS "Peace & Quiet" cyan variant that dms/colors.kdl
# generates for niri, so the picker matches the window borders.
[colors]
background=130f1af2
text=f0f0f0ff
prompt=f0f0f0ff
input=f0f0f0ff
selection=49ccd2ff
selection-text=130f1aff
match=49ccd2ff
selection-match=130f1aff
border=49ccd2ff

[border]
radius=14
width=2

[dmenu]
exit-immediately-if-empty=yes
