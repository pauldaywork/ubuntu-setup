# fuzzel's default config: the application launcher on Mod+Space.
#
# Every other fuzzel in this setup is handed a config explicitly — the project
# and task pickers get niri-tasks' picker.ini, the wallpaper picker gets
# wallpaper-picker.ini. This is the file fuzzel reads when nothing is passed,
# which is how the bare `fuzzel` in the Mod+Space bind ends up here.
#
# It was a leftover until now: a machine-local file written months before this
# repo existed, themed Dracula-ish, in no manifest and checked by nothing, so the
# DankMaterialShell sweep went straight past it and the launcher kept looking
# like it belonged to a different desktop. Two things in it were also quietly
# broken; see terminal and icon-theme.
#
# Deliberately not a copy of picker.ini. That file is tuned for a dmenu picker
# handed a short list — icons off, no prompt, no sorting — and a launcher wants
# all three. What is copied from it is the appearance, so the two read as the
# same surface.

[main]
font=Ubuntu:size=11

# Was `kitty -e`, and kitty is not installed — ghostty is, and is the terminal
# in the manifest. Anything with Terminal=true in its .desktop entry silently
# failed to start.
terminal=ghostty -e

prompt="❯ "

# overlay so it sits above fullscreen windows, like the other pickers.
layer=overlay

# Was `Papirus-Dark`, which is not installed either, so fuzzel fell back to
# hicolor: applications that ship their own icon (Chrome, Firefox, Code) drew
# one and everything else came up blank.
#
# Yaru rather than the desktop's actual setting, which is Yaru-purple-dark. That
# one inherits Yaru-purple then Yaru, and only Yaru carries the application
# icons, so this is where the chain was going to end anyway — without pinning a
# personal accent colour into a file that has nothing to do with accents.
icon-theme=Yaru
icons-enabled=yes

lines=10
width=40

# The same padding as picker.ini, where the old file used 5/5/10 and read as a
# much tighter box than the other popups.
horizontal-pad=28
vertical-pad=18
inner-pad=12

# Both kept from the old file, and both wanted here where the pickers turn them
# off: a launcher over every installed application is worth counting and worth
# sorting by what you actually open.
match-counter=yes
sort-result=yes

# Colours from picker.ini, so this matches the project, task and wallpaper
# pickers rather than the Dracula palette it used to carry.
#
# The background is half-transparent to match ghostty's background-opacity of
# 0.5 — niri blurs what is behind it via the layer-rule on the "launcher"
# namespace in config.kdl. That rule was already matching this window; the old
# opaque 282a36ff simply hid all of it, which is the failure mode the comments in
# picker.ini and config/waybar/style.css both warn about.
[colors]
background=130f1a80
text=ffffff80
prompt=ffffff80
input=ffffff80
selection=00000000
selection-text=ffffffff
selection-match=ffffffff
match=49ccd2ff
border=49ccd2ff

[border]
radius=14
# No outline, where the old file drew a 1px purple one. The blurred,
# half-transparent background separates the popup from the wallpaper on its own,
# and a hard edge fought that. radius still applies with width=0.
width=0

[dmenu]
# Only reached by a `fuzzel --dmenu` that passes no --config, which nothing here
# does — every dmenu caller names its own file. Kept from the old config so that
# an ad-hoc one from the command line behaves the way it used to.
exit-immediately-if-empty=yes
