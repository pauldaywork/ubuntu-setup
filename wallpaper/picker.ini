# fuzzel theme for the wallpaper picker (Mod+Alt+B), passed with --config= by
# wallpaper/pick.sh.
#
# A copy of niri-tasks' fuzzel/picker.ini rather than a reuse of it, and the
# reason is one line: that file sets icons-enabled=no, this picker is thumbnails,
# and fuzzel has no command-line override in that direction — -I/--no-icons turns
# them off, nothing turns them on. So the choice was to copy the theme or to edit
# a file in another repo and change how Mod+Alt+P/T/L look as a side effect.
#
# The cost of the copy is that it is a copy: if the pickers there are restyled,
# this does not follow. The colours below are the DMS "Peace & Quiet" cyan
# variant, matching them as of this writing.
#
# Note this is deliberately NOT waybar's palette, which lost its accent when the
# bars went white and untinted. The thing this should look like a sibling of is
# the other Mod+Alt pickers, not the bar.

[main]
font=Ubuntu:size=11

# Half the row height, and therefore half the thumbnail height: a row is two
# line-heights tall and an icon is scaled to fit it. This has to stay at exactly
# THUMB_H / 2 from pick.sh or the images stop filling their rows — 90 against
# THUMB_H 180. The comment there has the rest of the arithmetic.
line-height=90
icons-enabled=yes

# Empty prompt: no label, no header. The input row still renders — fuzzel always
# shows one — but it is blank until you type, and typing filters the list.
prompt=""

# overlay so it sits above fullscreen windows, like the other pickers.
layer=overlay
horizontal-pad=28
vertical-pad=18
inner-pad=12
match-counter=no

# pick.sh feeds the wallpapers in glob order, which bash has already sorted.
sort-result=no

# Colours track the DMS "Peace & Quiet" cyan variant, same as the other pickers.
#
# The background is half-transparent to match ghostty's background-opacity of
# 0.5 — niri blurs what is behind it via the layer-rule on the "launcher"
# namespace in config.kdl, which is the half of the effect this file cannot do
# on its own. Raising this alpha back towards ff makes the blur invisible, the
# same trap config/waybar/style.css warns about for the bars.
[colors]
background=130f1a80
text=ffffff80
prompt=ffffff80
input=ffffff80
# A visible wash, where the other pickers leave this transparent and mark the
# selected row by brightening its text. There is no text in this one, so that
# would have left nothing at all to say which wallpaper you are about to choose.
# Kept at low alpha so it tints the image rather than obscuring it.
selection=49ccd244
selection-text=ffffffff
selection-match=ffffffff
match=49ccd2ff
border=49ccd2ff

[border]
radius=14
# No outline. The blurred, half-transparent background is enough to separate the
# popup from the wallpaper, and a hard cyan edge around it fought that. radius
# still applies with width=0, so the corners stay rounded.
width=0

[dmenu]
# There is nothing to type into an empty list here — unlike the project picker,
# an unmatched name cannot be created — so an empty directory should just close.
#
# Note there is nothing to type into a full one either: pick.sh gives every entry
# the same blank label so that the thumbnails can use the whole width, which
# means filtering matches nothing. This picker is arrow keys and Enter.
exit-immediately-if-empty=yes
